version: '3.8'

services:
  ocr_module:
    build:
      context: ./products/ocr_engine
      dockerfile: Dockerfile
    ports:
      - "5001:5001"
    volumes:
      - ./model_cache/deepface:/root/.deepface
      - ./model_cache/paddlex:/root/.paddlex
      - ./model_cache/paddleocr:/root/.paddleocr
      - ./model_cache/huggingface:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  eye_tracking_module:
    build:
      context: ./products/eye_tracking_module
      dockerfile: Dockerfile
    ports:
      - "5002:5002"
    restart: unless-stopped

  accessibility_module:
    image: nginx:alpine
    ports:
      - "5174:80"
    volumes:
      # This points to where your .html files are so Nginx can serve them
      - ./products:/usr/share/nginx/html:ro
      - ./products/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
