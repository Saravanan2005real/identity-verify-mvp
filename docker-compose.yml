services:
  ocr_module:
    build:
      context: ./products/ocr_engine
      dockerfile: Dockerfile
    ports:
      - "5001:5001"
    env_file:
      - ./.env
    environment:
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-}
      - APPLICANT_SESSION_SECRET=${APPLICANT_SESSION_SECRET}
      - ASSET_SIGNING_SECRET=${ASSET_SIGNING_SECRET}
      - ALLOWED_CORS_ORIGINS=${ALLOWED_CORS_ORIGINS:-http://localhost:8081,http://localhost:8082,http://localhost:5174,http://127.0.0.1:8081,http://127.0.0.1:8082,http://127.0.0.1:5174}
      - REVOCATION_BACKEND=${REVOCATION_BACKEND:-memory}
    volumes:
      - ./model_cache/deepface:/root/.deepface
      - ./model_cache/paddlex:/root/.paddlex
      - ./model_cache/paddleocr:/root/.paddleocr
      - ./model_cache/huggingface:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  eye_tracking_module:
    build:
      context: ./products/eye_tracking_module
      dockerfile: Dockerfile
    ports:
      - "5002:5002"
    restart: unless-stopped

  accessibility_module:
    image: nginx:alpine
    ports:
      - "5174:80"
    volumes:
      # This points to where your .html files are so Nginx can serve them
      - ./products:/usr/share/nginx/html:ro
      - ./products/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
