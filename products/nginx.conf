# ==============================================================================
# nginx.conf — Verifyyy eKYC Reverse Proxy
# Remediation D: Fixed malformed proxy_set_header directives (PowerShell garbage
# had leaked into the file). Bind address and allowed origins are configurable
# via environment variables at the compose/deployment layer.
# ==============================================================================

server {
    # Listen on all interfaces inside the container (Nginx is behind a host firewall
    # and/or Docker network; internal services are further restricted at the
    # docker-compose level via `ports` and `networks` directives).
    listen 80;

    # ---- Request Limits -------------------------------------------------------
    client_max_body_size 10M;
    client_body_timeout  30s;
    client_header_timeout 10s;
    keepalive_timeout    65s;

    # ---- Security Headers -----------------------------------------------------
    add_header X-Content-Type-Options   "nosniff"                         always;
    add_header X-Frame-Options          "DENY"                            always;
    add_header X-XSS-Protection         "1; mode=block"                   always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy
        "default-src 'self'; script-src 'self' 'unsafe-inline' https://fonts.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self';"
        always;

    # ---- Static Frontend ------------------------------------------------------
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # ---- Proxy: OCR / Verification API ----------------------------------------
    # Restricted to the internal Docker network; not exposed on the host directly.
    location /api/v1/ {
        proxy_pass         http://ocr_module:5001/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ---- Proxy: Eye Tracking module -------------------------------------------
    location /api/v1/eye/ {
        proxy_pass         http://eye_tracking_module:5002/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ---- Proxy: Signed asset URLs (face crops / pipeline images) --------------
    # The OCR service validates HMAC signatures; Nginx only forwards the request.
    location /ocr_uploads/ {
        proxy_pass         http://ocr_module:5001/ocr_uploads/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
