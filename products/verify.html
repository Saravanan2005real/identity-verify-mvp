<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verifyyy - Interactive Verification Flow</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .runner-container {
            max-width: 800px;
            margin: 30px auto;
            padding: 32px;
            background: var(--card);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            box-shadow: 0 20px 40px -15px rgba(0,0,0,0.07);
        }
        .pipeline-stepper {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 28px;
            flex-wrap: wrap;
        }
        .step-pill {
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 700;
            background: #f1f5f9;
            color: var(--text-muted);
            border: 1px solid var(--border-color);
            transition: all 0.3s;
        }
        .step-pill.active {
            background: var(--primary-light);
            color: var(--primary);
            border-color: var(--primary);
            box-shadow: 0 0 10px rgba(15, 118, 110, 0.2);
        }
        .step-pill.completed {
            background: rgba(34, 197, 94, 0.15);
            color: var(--success);
            border-color: var(--success);
        }
        .step-divider {
            color: var(--text-muted);
            font-weight: bold;
        }
        .live-video-wrap {
            position: relative;
            width: 100%;
            max-width: 500px;
            margin: 0 auto 16px;
            border-radius: 12px;
            overflow: hidden;
            background: #000;
        }
        video {
            width: 100%;
            display: block;
            transform: scaleX(-1);
        }
        .hidden { display: none !important; }
        .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 700;
        }
        .badge-success { background: rgba(34, 197, 94, 0.2); color: #166534; }
        .badge-danger { background: rgba(239, 68, 68, 0.2); color: #991b1b; }
        .badge-info { background: var(--primary-light); color: var(--primary); }
        .face-images {
            display: flex;
            gap: 16px;
            justify-content: center;
            margin-top: 16px;
        }
        .face-images img {
            width: 110px;
            height: 110px;
            object-fit: cover;
            border-radius: 8px;
            border: 2px solid var(--border-color);
        }
        .cal-dot {
            position: absolute;
            width: 40px;
            height: 40px;
            background: #ef4444;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            cursor: pointer;
            z-index: 999;
            border: none;
            box-shadow: 0 0 10px rgba(239, 68, 68, 0.5);
        }
        .cal-done {
            background: #10b981 !important;
            pointer-events: none;
        }
        .cal-hud {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            z-index: 9999;
            background: rgba(0,0,0,0.85);
            padding: 12px 24px;
            border-radius: 9999px;
            color: #fff;
        }
    </style>
</head>
<body>
    <nav style="display:flex; justify-content:space-between; align-items:center; max-width:800px; margin:0 auto 20px;">
        <h2 style="margin:0; text-align:left; color: var(--primary); font-family:'Outfit', sans-serif;">Verifyyy Flow Runner</h2>
        <span id="pipeline-id-tag" style="font-family:monospace; font-size:0.85rem; color:var(--text-muted); background:#f1f5f9; padding:4px 10px; border-radius:8px;">PID: UNKNOWN</span>
    </nav>

    <div class="runner-container">
        <!-- Stepper header -->
        <div id="pipeline-stepper" class="pipeline-stepper"></div>

        <div id="flow-content">
            <!-- Dynamic Module Content Will Render Here -->
        </div>

        <!-- Canvas for live frame capture -->
        <canvas id="runner-canvas" class="hidden"></canvas>
    </div>

    <!-- Scripts -->
    <script src="webgazer.js"></script>
    <script src="verify.js?v=1"></script>
</body>
</html>
